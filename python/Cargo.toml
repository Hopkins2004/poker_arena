[package]
name = "arena_py"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "PyO3 bindings for the poker arena (Python package `pokerarena`)."

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
engine = { path = "../crates/engine" }
arena = { path = "../crates/arena" }
bots = { path = "../crates/bots" }
pyo3 = "0.30.1"
numpy = "0.30.0"
serde_json = "1.0.154"
rand_xoshiro = "0.8"
rayon = "1.12.0"
