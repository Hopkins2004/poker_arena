# 6-max No-Limit Hold'em cash game with the three anchored baselines (bots/NLH).
# Anchored bots keep a fixed Elo (random 850, station 400, tag 1300) that pins the scale.
# 3 bots at 6 seats: each table seats every bot twice (pooled for rating);
# T = max(3, ceil(4*3/6)) = 3 tables per round.

[run]
rounds = 5
seed = 2026
# threads = 8                 # default: all cores
results_dir = "results"
leaderboard = "leaderboard.json"

[format]
variant = "nlhe"
max_seats = 6

[table]
hands_per_table = 1000
starting_stack_bb = 100
mode = "cash"
blinds = { sb = 1, bb = 2, ante = 0 }
stack_policy = "reset_each_hand"
duplicate_mode = false
illegal_action_policy = "fold_or_check"
record_timing = true
hand_history = false

[matchmaking]
min_appearances = 4
allow_duplicate_bot_at_table = true
balance_pairs = true

[rating]
initial = 1500
k = 16
score_mode = "binary"
margin_c = 30

[[bots]]
name = "random"
kind = "python:bots.NLH.random_legal.RandomLegal"
anchor = 850

[[bots]]
name = "station"
kind = "python:bots.NLH.calling_station.CallingStation"
anchor = 400

[[bots]]
name = "tag"
kind = "python:bots.NLH.tag.TightAggressive"
anchor = 1300
