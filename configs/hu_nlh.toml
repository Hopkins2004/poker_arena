# Heads-up No-Limit Hold'em, duplicate mode for variance reduction.

[run]
rounds = 3
seed = 7

[format]
variant = "nlhe"
max_seats = 2

[table]
hands_per_table = 2000          # 1000 deals x 2 seat rotations
starting_stack_bb = 100
blinds = { sb = 1, bb = 2 }
stack_policy = "reset_each_hand"
duplicate_mode = true

[matchmaking]
min_appearances = 4

[rating]
score_mode = "margin"
margin_c = 30

[[bots]]
name = "random"
kind = "python:pokerarena.baselines.RandomLegal"
params = { fold = 1.0, call = 2.0, raise = 1.0, raise_sizes = [0.5, 1.0] }
anchor = 850

[[bots]]
name = "station"
kind = "python:pokerarena.baselines.CallingStation"
anchor = 400

[[bots]]
name = "tag"
kind = "python:pokerarena.baselines.TightAggressive"
params = { samples = 300 }
anchor = 1300
