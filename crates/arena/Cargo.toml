[package]
name = "arena"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Bot interface, table runner, matchmaking, ratings and the parallel scheduler."

[dependencies]
engine = { path = "../engine" }
indicatif = "0.18.6"
rand_core = "0.10"
rand_xoshiro = "0.8"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
toml = "1.2.1"

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"
