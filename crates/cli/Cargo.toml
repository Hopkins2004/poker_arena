[package]
name = "cli"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The `arena` command-line tool: run, bench, leaderboard."

[[bin]]
name = "arena"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
arena = { path = "../arena" }
# Pinned: the registry index currently lacks a clap_derive release matching clap 4.6.7.
clap = { version = "=4.6.1", features = ["derive"] }
rayon = "1.12.0"
rand_xoshiro = "0.8"

